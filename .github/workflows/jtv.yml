name: Update JTV JSON

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  update-data:
  
    permissions:
      contents: write 
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Process Data
        env:
          JTV_URL: ${{ secrets.JTV_URL }}
        run: |
          python -c '
          import os
          import json
          import urllib.request
          import re

          url = os.environ.get("JTV_URL")
          try:
              req = urllib.request.Request(
                  url, 
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode("utf-8")
              
            
              cookie_value = ""
              for line in content.splitlines():
                  if "EXTHTTP" in line:
                      try:
                         
                          json_part = line.split("EXTHTTP:")[1].strip()
                          data = json.loads(json_part)
                          if "cookie" in data:
                              cookie_value = data["cookie"]
                              break
                      except Exception:
                          
                          match = re.search(r"__hdnea__=[^\"\}\s]+", line)
                          if match:
                              cookie_value = match.group(0)
                              break
              
             
              output_data = {
                  "cookie": cookie_value
              }
              
              
              os.makedirs("JTV", exist_ok=True)
              with open("JTV/jtv.json", "w", encoding="utf-8") as f:
                  json.dump(output_data, f, indent=4)
                  
              print("Successfully updated JTV/jtv.json")
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add JTV/jtv.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JTV JSON [skip ci]" && git push)
