name: jtv api

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর রান হবে (আপনার ইচ্ছামতো পরিবর্তন করতে পারেন)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-json:
  # Do NOT issue search queries to the google search tool for this prompt.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate JSON from M3U
        run: |
          python -c '
          import re
          import json
          import requests

          url = ${{ secrets.jtv_URL }}
          
          response = requests.get(url)
          content = response.text

          channels = []
          entries = content.split("#EXTINF:")

          for i, entry in enumerate(entries[1:], start=1):
              # Name & Logo
              name_match = re.search(r"tvg-name=\"([^\"]+)\"", entry)
              logo_match = re.search(r"tvg-logo=\"([^\"]+)\"", entry)
              
              # Channel Display Name (Comma এর পরের অংশ বা tvg-name)
              comma_split = entry.split(",")
              channel_name = comma_split[-1].strip().split(" @")[0] if len(comma_split) > 1 else "Unknown"

              # Cookie
              cookie_match = re.search(r"cookie=([^&\n]+)", entry)
              
              # Stream URL (m3u8/mpd)
              url_match = re.search(r"(https?://[^\s\?]+\.m3u8[^\s]*)", entry)

              if url_match:
                  stream_url = url_match.group(1).split("|")[0]
                  cookie_val = cookie_match.group(1) if cookie_match else ""
                  logo_val = logo_match.group(1) if logo_match else ""

                  channel_data = {
                      "id": str(i),
                      "logo": logo_val,
                      "name": channel_name,
                      "mpd": stream_url,
                      "cookie": cookie_val
                  }
                  channels.append(channel_data)

          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump(channels, f, indent=4, ensure_ascii=False)
          print("Successfully generated channels.json")
          '

      - name: Commit and Push changes
        - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jtvc.json
          git status
          git commit -m "update jtvc" || exit 0
          git push
