name: Update JCMRZCK JSON

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Update JSON
        env:
          JCMRZCK_URL: ${{ secrets.JCMRZCK_URL }}
        run: |
          mkdir -p JCMRZCK
          python -c "import urllib.request, json, os; response = urllib.request.urlopen(os.environ['JCMRZCK_URL']); data = json.loads(response.read().decode()); open('JCMRZCK/jcmrzck.json', 'w').write(json.dumps(data, indent=4))"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add JCMRZCK/jcmrzck.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jcmrzck.json via API" && git push)
