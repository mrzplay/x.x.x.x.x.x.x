name: HSDigital

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate JSON in HSDigital folder
        env:
          HSDIGITAL_URL: ${{ secrets.HSDIGITAL_URL }}
        run: |
          python3 -c "
          import urllib.request
          import re
          import json
          import os

          url = os.environ['HSDIGITAL_URL']
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
          except Exception as e:
              print(f'Error fetching URL: {e}')
              exit(1)

          channels = []
          blocks = content.split('#EXTINF:-1')
          
          id_counter = 1
          for block in blocks:
              if not block.strip():
                  continue
              
              # Extract Name
              name_match = re.search(r'tvg-name=\"([^\"]+)\"', block)
              if not name_match:
                  continue
              raw_name = name_match.group(1)
              name = re.sub(r'\s*(?:By|@).*$', '', raw_name).strip()
              
              # Extract Logo
              logo_match = re.search(r'tvg-logo=\"([^\"]+)\"', block)
              logo = logo_match.group(1) if logo_match else ''
              
              # Extract Clearkey
              key_match = re.search(r'#KODIPROP:inputstream\.adaptive\.license_key=([^\s]+)', block)
              clearkey = key_match.group(1) if key_match else ''
              
              # Extract Cookie from EXTVLCOPT
              cookie_match = re.search(r'#EXTVLCOPT:http-cookie=([^\s]+)', block)
              cookie = cookie_match.group(1) if cookie_match else ''
              
              # Extract MPD URL and strip pipe parameters + trailing '?' if present
              url_match = re.findall(r'(https?://[^\s]+)', block)
              mpd_url = ''
              if url_match:
                  full_link = url_match[-1].split('|')[0]
                  mpd_url = full_link.rstrip('?')

              channels.append({
                  'id': f'{id_counter:03d}',
                  'name': name,
                  'logo': logo,
                  'clearkey': clearkey,
                  'mpd': mpd_url,
                  'cookie': cookie
              })
              id_counter += 1

          # Create directory if it doesn't exist
          os.makedirs('HSDigital', exist_ok=True)

          # Save to HSDigital/hsdigital.json
          file_path = os.path.join('HSDigital', 'hsdigital.json')
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(channels, f, indent=4, ensure_ascii=False)
              
          print(f'Successfully generated {file_path} with {len(channels)} channels.')
          "

      - name: Commit and push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HSDigital/hsdigital.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update HSDigital/hsdigital.json [skip ci]" && git push)
