name: JCK

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch and Clean Cookie
        env:
          JCK_URL: ${{ secrets.JCK_URL }}
        run: |
          python -c '
          import requests
          import json
          import os

          api_url = os.environ.get("JCK_URL")
          
          try:
              response = requests.get(api_url, timeout=15)
              data = response.json()
              
              if "cookie" in data:
                  cleaned_cookie = data["cookie"].replace(r"\/*", "/*")
                  
                  output_data = {
                      "cookie": cleaned_cookie
                  }
                  
                  with open("cookie.json", "w", encoding="utf-8") as f:
                      json.dump(output_data, f, indent=4, ensure_ascii=False)
                  
                  print("Successfully updated cookie.json")
              else:
                  print("Cookie key not found in API response.")
          except Exception as e:
              print(f"Error: {e}")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jck.json
          git diff --staging --quiet || (git commit -m "Auto-update cookie JSON" && git push)
