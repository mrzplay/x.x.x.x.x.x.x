name: JCK

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch and Clean Cookie
        env:
          JCK_URL: ${{ secrets.JCK_URL }}
        run: |
          python -c '
          import requests
          import json
          import os

          url = os.environ.get("JCK_URL")
          folder_name = "JCK"
          
          # JCK ফোল্ডার না থাকলে তৈরি করে নেওয়া
          if not os.path.exists(folder_name):
              os.makedirs(folder_name, exist_ok=True)
              
          file_path = os.path.join(folder_name, "jck.json")
          
          try:
              response = requests.get(url, timeout=15)
              data = response.json()
              
              if "cookie" in data:
                  cleaned_cookie = data["cookie"].replace(r"\/*", "/*")
                  
                  output_data = {
                      "cookie": cleaned_cookie
                  }
                  
                  with open(file_path, "w", encoding="utf-8") as f:
                      json.dump(output_data, f, indent=4, ensure_ascii=False)
                  
                  print(f"Successfully updated {file_path}")
              else:
                  print("Cookie key not found in API response.")
          except Exception as e:
              print(f"Error: {e}")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add JCK/jck.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JCK json" && git push)
