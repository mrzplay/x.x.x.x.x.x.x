name: Extract SL Cookie

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *' 

jobs:
  extract-cookie:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction and Save JSON
        env:
          SONYC_URL: ${{ secrets.SONYC_URL }}
        run: |
          python -c '
          import os
          import json
          import urllib.request
          import re

          url = os.environ.get("SONYC_URL")
          if not url:
              raise ValueError("SONYC_URL secret is not set.")

          # Fetch JSON data from the source API
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode("utf-8"))

          # Extract videoURL from the JSON response structure
          video_url = data.get("resultObj", {}).get("videoURL", "")
          
          if not video_url:
              raise ValueError("videoURL not found in the response data.")

          # Extract hdnea token using regex
          match = re.search(r"(hdnea=[^&]+)", video_url)
          
          if match:
              hdnea_value = match.group(1)
              output = {
                  "cookie": hdnea_value
              }
              
              
              os.makedirs("SL", exist_ok=True)
              with open("SL/sonyc.json", "w") as f:
                  json.dump(output, f, indent=4)
              print("Successfully saved to SL/sonyc.json")
          else:
              raise ValueError("hdnea token not found in videoURL.")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add SL/sonyc.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SL sonyc.json" && git push)
