name: Extract SonyLIV Cookie

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  extract-cookie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction and Save JSON
        env:
          SONYC_URL: ${{ secrets.SONYC_URL }}
        run: |
          # Install requests library just in case
          pip install requests

          python -c '
          import os
          import json
          import re
          import requests

          url = os.environ.get("SONYC_URL")
          if not url:
              raise ValueError("SONYC_URL secret is not set.")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.sonyliv.com/",
              "Origin": "https://www.sonyliv.com"
          }

          response = requests.get(url, headers=headers)
          print(f"Response Status Code: {response.status_code}")
          
          if response.status_code != 200:
              raise Exception(f"Failed to fetch data, status code: {response.status_code}")

          data = response.json()

          # Extract videoURL from the JSON response structure
          video_url = data.get("resultObj", {}).get("videoURL", "")
          
          if not video_url:
              raise ValueError("videoURL not found in the response data.")

          # Extract hdnea token using regex
          match = re.search(r"(hdnea=[^&]+)", video_url)
          
          if match:
              hdnea_value = match.group(1)
              output = {
                  "cookie": hdnea_value
              }
              
              os.makedirs("SL", exist_ok=True)
              with open("SL/sonyc.json", "w") as f:
                  json.dump(output, f, indent=4)
              print("Successfully saved to SL/sonyc.json")
          else:
              raise ValueError("hdnea token not found in videoURL.")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add SL/sonyc.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SL sonyc.json" && git push)
