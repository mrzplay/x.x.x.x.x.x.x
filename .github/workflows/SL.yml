name: Extract SonyLIV Cookie

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  extract-cookie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction and Save JSON
        env:
          SONYC_URL: ${{ secrets.SONYC_URL }}
        run: |
          # Use curl to bypass 403 blocks with proper browser headers
          response=$(curl -s -L "$SONYC_URL" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://www.sonyliv.com/" \
            -H "Origin: https://www.sonyliv.com")

          echo "API Response fetched."

          # Run python to parse json, extract regex and save
          python -c '
          import os
          import json
          import re

          raw_data = """'"$response"'''
          
          try:
              data = json.loads(raw_data)
          except Exception as e:
              print("Failed to parse JSON. Raw response was:")
              print(raw_data[:500])
              raise e

          # Extract videoURL from the JSON response structure
          video_url = data.get("resultObj", {}).get("videoURL", "")
          
          if not video_url:
              raise ValueError("videoURL not found in the response data.")

          # Extract hdnea token using regex
          match = re.search(r"(hdnea=[^&]+)", video_url)
          
          if match:
              hdnea_value = match.group(1)
              output = {
                  "cookie": hdnea_value
              }
              
              os.makedirs("SL", exist_ok=True)
              with open("SL/sonyc.json", "w") as f:
                  json.dump(output, f, indent=4)
              print("Successfully saved to SL/sonyc.json")
          else:
              raise ValueError("hdnea token not found in videoURL.")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add SL/sonyc.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SL sonyc.json" && git push)
