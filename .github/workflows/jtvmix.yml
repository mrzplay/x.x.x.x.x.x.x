name: JTVMIX

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর রান হবে
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Parse M3U to JSON
        env:
          JTVMIX_URL: ${{ secrets.JTVMIX_URL }}
        run: |
          mkdir -p JTVMIX
          python -c "
          import urllib.request, os, re, json

          url = os.environ['JTVMIX_URL']
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  m3u_content = response.read().decode('utf-8')
              
              lines = m3u_content.splitlines()
              channels = []
              
              current_id = ''
              current_name = ''
              current_logo = ''
              current_clearkey = ''
              
              for line in lines:
                  line = line.strip()
                  if line.startswith('#EXTINF:'):
                      # tvg-id এক্সট্রাক্ট করা
                      id_match = re.search(r'tvg-id=\"([^\"]+)\"', line)
                      current_id = id_match.group(1) if id_match else ''
                      
                      # tvg-logo এক্সট্রাক্ট করা
                      logo_match = re.search(r'tvg-logo=\"([^\"]+)\"', line)
                      current_logo = logo_match.group(1) if logo_match else ''
                      
                      # চ্যানেলের নাম (কমা (,) এর পরের অংশ)
                      if ',' in line:
                          current_name = line.split(',')[-1].strip()
                  
                  elif line.startswith('#KODIPROP:inputstream.adaptive.license_key='):
                      current_clearkey = line.split('=', 1)[1].strip()
                  
                  elif line.startswith('http'):
                      raw_url = line
                      
                      # পাইপ (|) বা এক্সট্রা প্যারামিটার আলাদা করা
                      mpd_url = raw_url
                      cookie_val = ''
                      
                      if '|' in raw_url:
                          mpd_url, params = raw_url.split('|', 1)
                          if 'cookie=' in params:
                              for p in params.split('&'):
                                  if p.startswith('cookie='):
                                      cookie_val = p.split('=', 1)[1]
                                      break
                      
                      # যদি পাইপ থেকে কুকি না পাওয়া যায়, তবে ইউআরএলের ভেতরের __hdnea__ খোঁজা
                      if not cookie_val and '__hdnea__=' in raw_url:
                          match_hd = re.search(r'(__hdnea__=[^&\s]+)', raw_url)
                          if match_hd:
                              cookie_val = match_hd.group(1)

                      # মূল এমপিডি লিংক থেকে অতিরিক্ত কুয়েরি স্ট্রিং রিমুভ করে ক্লিন করা
                      if '?' in mpd_url:
                          base_mpd = mpd_url.split('?')[0]
                      else:
                          base_mpd = mpd_url

                      # চূড়ান্ত এমপিডি লিংক তৈরি: mpd?cookie ফরম্যাটে
                      final_mpd_link = f'{base_mpd}?{cookie_val}' if cookie_val else base_mpd

                      channel_entry = {
                          'id': current_id,
                          'name': current_name,
                          'logo': current_logo,
                          'clearkey': current_clearkey,
                          'mpd': final_mpd_link,
                          'cookie': cookie_val
                      }
                      channels.append(channel_entry)
                      
                      # রিসেট করা পরবর্তী চ্যানেলের জন্য
                      current_id = ''
                      current_name = ''
                      current_logo = ''
                      current_clearkey = ''

              with open('JTVMIX/jtvmix.json', 'w', encoding='utf-8') as f:
                  json.dump(channels, f, indent=4, ensure_ascii=False)
              print('Successfully updated JTVMIX/jtvmix.json')
          except Exception as e:
              print(f'Error processing M3U data: {e}')
              exit(1)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add JTVMIX/jtvmix.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jtvmix.json every 1 hour" && git push)
