name: mRzJC

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate JSON from M3U
        env:
          MRZJC_URL: ${{ secrets.MRZJC }}
        run: |
          python -c '
          import re
          import json
          import requests
          import os

          url = os.environ.get("MRZJC_URL")
          
          response = requests.get(url)
          content = response.text

          channels = []
          entries = content.split("#EXTINF:")

          for i, entry in enumerate(entries[1:], start=1):
              # tvg-name থেকে সরাসরি নাম তোলার জন্য
              tvg_name_match = re.search(r"tvg-name=\"([^\"]+)\"", entry)
              if tvg_name_match:
                  raw_name = tvg_name_match.group(1)
                  channel_name = raw_name.split(" By ")[0].split(" @")[0].strip()
              else:
                  comma_split = entry.split(",")
                  channel_name = comma_split[-1].strip().split(" @")[0] if len(comma_split) > 1 else "Unknown"

              # Logo
              logo_match = re.search(r"tvg-logo=\"([^\"]+)\"", entry)
              logo_val = logo_match.group(1) if logo_match else ""

              # Cookie
              cookie_match = re.search(r"cookie=([^&\n\"]+)", entry)
              cookie_val = cookie_match.group(1) if cookie_match else ""

              # Stream URL (m3u8/mpd)
              url_match = re.search(r"(https?://[^\s\?]+\.m3u8[^\s]*)", entry)

              if url_match:
                  clean_url = url_match.group(1).split("|")[0].rstrip("?")
                  
                  # mpd format: url + ? + cookie
                  final_mpd = f"{clean_url}?{cookie_val}" if cookie_val else clean_url

                  channel_data = {
                      "id": str(i),
                      "logo": logo_val,
                      "name": channel_name,
                      "mpd": final_mpd,
                      "cookie": cookie_val
                  }
                  channels.append(channel_data)

          with open("jcmrz", "w", encoding="utf-8") as f:
              json.dump(channels, f, indent=4, ensure_ascii=False)
          print("Successfully generated jcmrz")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add jcmrz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jcmrz" && git push)
