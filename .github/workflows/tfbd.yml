name: TFBD

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর রান হবে
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Parse M3U to JSON
        env:
          TFBD_URL: ${{ secrets.TFBD_URL }}
        run: |
          mkdir -p TFBD
          python -c "
          import urllib.request, os, re, json

          url = os.environ['TFBD_URL']
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  m3u_content = response.read().decode('utf-8')
              
              lines = m3u_content.splitlines()
              channels = []
              
              current_logo = ''
              current_name = ''
              channel_counter = 1
              
              for line in lines:
                  line = line.strip()
                  if line.startswith('#EXTINF:'):
                      # tvg-logo এক্সট্রাক্ট করা
                      logo_match = re.search(r'tvg-logo=\"([^\"]+)\"', line)
                      current_logo = logo_match.group(1) if logo_match else ''
                      
                      # চ্যানেলের নাম (কমা বা কমা-স্পেস এর পরের অংশ)
                      if ',' in line:
                          current_name = line.split(',')[-1].strip()
                  
                  elif line.startswith('http'):
                      mpd_url = line
                      
                      # URL থেকে কুকি বা টোকেন (edge-cache-token বা কোয়েরি স্ট্রিং) এক্সট্রাক্ট করা
                      cookie_val = ''
                      if '?' in mpd_url:
                          query_part = mpd_url.split('?')[1]
                          if 'edge-cache-token=' in query_part:
                              for param in query_part.split('&'):
                                  if param.startswith('edge-cache-token='):
                                      cookie_val = param
                                      break
                          else:
                              cookie_val = query_part

                      # তিন অঙ্কের ফরম্যাট আইডি তৈরি (যেমন: 001, 002, ...)
                      id_str = f'{channel_counter:03d}'

                      channel_entry = {
                          'id': id_str,
                          'name': current_name,
                          'logo': current_logo,
                          'clearkey': '',
                          'mpd': mpd_url,
                          'cookie': cookie_val
                      }
                      channels.append(channel_entry)
                      
                      # রিসেট এবং কাউন্টার বৃদ্ধি
                      channel_counter += 1
                      current_logo = ''
                      current_name = ''

              with open('TFBD/tfbd.json', 'w', encoding='utf-8') as f:
                  json.dump(channels, f, indent=4, ensure_ascii=False)
              print('Successfully updated TFBD/tfbd.json')
          except Exception as e:
              print(f'Error processing M3U data: {e}')
              exit(1)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add TFBD/tfbd.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tfbd.json every 1 hour" && git push)
